plugins {
    id "com.android.application"
}

// Version comes from the release pipeline (-PappVersionName / -PappVersionCode).
// The defaults only apply to local builds.
def appVersionName = (findProperty("appVersionName") ?: "1.0.0").toString()
def appVersionCode = (findProperty("appVersionCode") ?: "1").toString().toInteger()

android {
    namespace "com.havalh6.viewer"
    compileSdk 36

    defaultConfig {
        applicationId "com.havalh6.viewer"
        minSdk 23
        targetSdk 28
        versionCode appVersionCode
        versionName appVersionName
    }

    // Debug builds use the default ~/.android/debug.keystore that AGP generates.
    // No keystore of any kind lives in this repository: the release key exists only
    // as a CI secret, and release builds are signed through these variables.
    signingConfigs {
        release {
            def keystorePath = System.getenv("SIGNING_KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Without SIGNING_KEYSTORE_FILE this yields an UNSIGNED apk, on purpose.
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    lint {
        // targetSdk 28 is deliberate: the app runs on an Android 9 head unit and
        // relies on pre-29 behaviour. This rule is a Google Play policy and the
        // app is never published there, so it would only block release builds.
        disable "ExpiredTargetSdkVersion"
    }

    sourceSets.main.assets.srcDir("$buildDir/generated/viewerAssets")

    testOptions {
        // TripEngine and friends are pure Java; nothing in the JVM tests may
        // silently touch an Android stub.
        unitTests.returnDefaultValues = false
    }

    // NOTE: do NOT add "glb"/"hdr" to androidResources.noCompress. It was tried
    // and it is measurably worse. Storing assets uncompressed lets them be read
    // without an inflate pass, but on this head unit the bottleneck is flash
    // I/O, not CPU: reading the same 10.79MB car model cold measured 2221ms
    // stored vs 516ms deflated (8.4MB on disk). Fewer bytes off flash wins by a
    // wide margin, so let AAPT compress them.
}

def prepareViewerSource = tasks.register("prepareViewerSource", Exec) {
    workingDir rootProject.projectDir
    commandLine "node", "scripts/prepare-android-www.mjs"
    inputs.files(
        rootProject.file("support.js"),
        rootProject.file("index.html"),
        rootProject.file("telemetryClient.js"),
        rootProject.file("appLauncherClient.js"),
        rootProject.file("scripts/prepare-android-www.mjs")
    )
    inputs.dir(rootProject.file("vendor"))
    outputs.dir(rootProject.layout.projectDirectory.dir("app/build/generated/viewerSource"))
}

def viewerAssets = tasks.register("syncViewerAssets", Sync) {
    dependsOn(prepareViewerSource)
    into(layout.buildDirectory.dir("generated/viewerAssets/www"))
    from(rootProject.layout.projectDirectory.dir("app/build/generated/viewerSource")) {
        include "index.html"
        include "support.js"
        include "telemetryClient.js"
        include "appLauncherClient.js"
        include "vendor/**"
    }
    from(rootProject.file("assets")) {
        into "assets"
        exclude "_backup/**"
        // Full-texture originals the viewer never fetches — build inputs for
        // the -lite files (scripts/build-lite-textures.mjs). ~50MB of APK.
        exclude "_source/**"
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("Assets")) {
        task.dependsOn(viewerAssets)
    }
    // Gradle 9 may schedule the release lint model before generated WebView
    // assets exist; keep the same source-sync edge as normal asset merging.
    if (task.name == "generateReleaseLintVitalReportModel" || task.name.startsWith("lintVital")) {
        task.dependsOn(viewerAssets)
    }
}

// Android Studio sync asks for this Kotlin IDE model task even on Java-only
// modules. Provide a no-op so Sync/Run from the IDE does not fail.
tasks.register("prepareKotlinBuildScriptModel") {}

dependencies {
    // JVM tests for the pure-Java trip engine (TripEngineTest, TripSignalsTest).
    testImplementation "junit:junit:4.13.2"
}
