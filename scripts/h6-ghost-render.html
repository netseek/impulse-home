<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1600px;height:800px;overflow:hidden}canvas{display:block}</style></head><body>
<script src="/vendor/three/build/three.min.js"></script>
<script src="/vendor/three/examples/js/loaders/GLTFLoader.js"></script>
<script>
(async () => { try {
const W=1600,H=800;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setClearColor(0,0); renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xb6d2ed,0x26354b,0.48));
for(const [p,intensity] of [[[0,6,4],0.65],[[-4,3,-3],0.35],[[5,4,1],0.24]]){const l=new THREE.DirectionalLight(0xffffff,intensity);l.position.set(...p);scene.add(l);}
const model=(await new THREE.GLTFLoader().loadAsync('/ghost.glb')).scene;
scene.add(model);model.updateMatrixWorld(true);
const remove=[];model.traverse(o=>{if(o.isMesh&&new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).length()>10)remove.push(o);});remove.forEach(o=>o.parent.remove(o));
const bounds=new THREE.Box3().setFromObject(model), center=bounds.getCenter(new THREE.Vector3());
const camera=new THREE.OrthographicCamera(-3,3,1.5,-1.5,0.1,100);
camera.position.copy(center).add(new THREE.Vector3(-2.4,2.0,9));camera.lookAt(center);camera.updateMatrixWorld();
// Fit all original geometry, with preserved generous transparent margins.
const points=[];model.traverse(o=>{if(!o.isMesh)return;const a=o.geometry.attributes.position;for(let i=0;i<a.count;i++)points.push(new THREE.Vector3().fromBufferAttribute(a,i).applyMatrix4(o.matrixWorld));});
const local=points.map(p=>p.clone().applyMatrix4(camera.matrixWorldInverse));
const xs=local.map(p=>p.x),ys=local.map(p=>p.y);
let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;for(const p of local){xmin=Math.min(xmin,p.x);xmax=Math.max(xmax,p.x);ymin=Math.min(ymin,p.y);ymax=Math.max(ymax,p.y);}
const half=Math.max((xmax-xmin)/2/0.88,(ymax-ymin)/0.80);
const cx=(xmin+xmax)/2,cy=(ymin+ymax)/2;
camera.left=cx-half;camera.right=cx+half;camera.top=cy+half/2;camera.bottom=cy-half/2;camera.updateProjectionMatrix();
const meshes=[];const tires=[];
model.traverse(o=>{if(!o.isMesh)return;const name=o.material.name||''; const b=new THREE.Box3().setFromObject(o);const c=b.getCenter(new THREE.Vector3());
if(/Tire/.test(name))tires.push({name:o.name,center:c.toArray(),size:b.getSize(new THREE.Vector3()).toArray()});
const hidden=/Leather|Panel|Trunk Floor|Trunk Cover|Brushed|Break/.test(name)||/Internals|Floor|Seat/i.test(o.name);
o.visible=!hidden;
meshes.push({o,name,c});
});
function project(p){const v=new THREE.Vector3(...p).project(camera);return [Number(((v.x+1)/2).toFixed(6)),Number(((1-v.y)/2).toFixed(6))];}
// Neutral ten-spoke schematic inserts, aligned to the actual tire centers.
// Added after fitting so the original projection and anchors remain identical.
for(const t of tires.filter(t=>t.size[2]>0.1)){
const group=new THREE.Group();group.position.set(...t.center);group.position.z+=Math.sign(t.center[2])*0.145;
scene.add(group);
const add=(geometry,name)=>{const o=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial());group.add(o);meshes.push({o,name});return o;};
add(new THREE.CircleGeometry(0.292,64),'WheelBacking');
add(new THREE.TorusGeometry(0.287,0.014,10,64),'Rim');
add(new THREE.CylinderGeometry(0.066,0.066,0.035,32),'Rim').rotation.x=Math.PI/2;
for(let i=0;i<10;i++){const a=i*Math.PI/5;const spoke=add(new THREE.BoxGeometry(0.034,0.23,0.022),'Rim');spoke.position.set(Math.sin(a)*0.165,Math.cos(a)*0.165,0.022);spoke.rotation.z=-a;}
}
window.renderGhost=theme=>{
const dark=theme==='dark';
for(const {o,name} of meshes){
const tire=/Tire/.test(name),glass=/glass/i.test(name),body=/Body|Roof/.test(name);
const rim=name==='Rim',backing=name==='WheelBacking';
const mat=new THREE.MeshStandardMaterial({color:backing?0x17212c:rim?0x8198ac:tire?0x34485a:glass?0x102538:0x91aabd,metalness:0.25,roughness:0.4,transparent:true,opacity:backing?0.6:rim?0.65:tire?0.65:glass?0.65:body?0.46:0.3,depthWrite:false,side:THREE.DoubleSide});
if(!dark&&!glass&&!rim&&!backing)mat.color.setHex(tire?0x263745:0x51697e);
if(!tire&&!glass&&!rim&&!backing){mat.onBeforeCompile=s=>{s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 ghostWorld;').replace('#include <begin_vertex>','#include <begin_vertex>\nghostWorld=(modelMatrix*vec4(position,1.0)).xyz;');s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 ghostWorld;').replace('#include <color_fragment>','#include <color_fragment>\nfloat cabin=1.0-smoothstep(0.65,1.3,ghostWorld.y); float span=smoothstep(-2.3,-1.3,ghostWorld.x)*(1.0-smoothstep(1.25,1.9,ghostWorld.x)); float hood=(1.0-smoothstep(-1.25,-0.85,ghostWorld.x))*smoothstep(0.65,1.0,ghostWorld.y); diffuseColor.a *= (1.0-0.77*cabin*span)*(1.0-0.38*hood);');};}
o.material.dispose();o.material=mat;
}
// Depth-only pass removes opposite-side surfaces without baking a background.
renderer.autoClear=false;renderer.clear();
const depth=new THREE.MeshBasicMaterial({colorWrite:false,side:THREE.FrontSide});
scene.overrideMaterial=depth;renderer.render(scene,camera);scene.overrideMaterial=null;
renderer.render(scene,camera);depth.dispose();return renderer.domElement.toDataURL('image/png');};
window.manifest={source:'assets/haval-h6-hev-lite.glb',width:W,height:H,coordinates:'Normalized to entire image; origin top-left, x right, y down. Both themes share projection.',projection:'orthographic elevated front three-quarter; nose left',bounds:{min:bounds.min.toArray(),max:bounds.max.toArray()},tires,notes:'Axles are geometry-derived tire centers. Engine/battery are schematic placement regions, not verified component geometry. No per-wheel traction is depicted.'};
const tread=tires.filter(t=>t.size[2]>0.1);
function axle(front){const ts=tread.filter(t=>front?t.center[0]<0:t.center[0]>0);const world=[0,1,2].map(i=>(ts[0].center[i]+ts[1].center[i])/2);return {center:project(world),world,ends:ts.map(t=>project(t.center)),nearWheel:project(ts.find(t=>t.center[2]>0).center)};}
function region(min,max){const corners=[];for(const x of [min[0],max[0]])for(const y of [min[1],max[1]])for(const z of [min[2],max[2]])corners.push(project([x,y,z]));return {center:project(min.map((v,i)=>(v+max[i])/2)),rect:{x:Math.min(...corners.map(p=>p[0])),y:Math.min(...corners.map(p=>p[1])),right:Math.max(...corners.map(p=>p[0])),bottom:Math.max(...corners.map(p=>p[1]))},projectedCorners:corners,worldBox:{min,max},schematic:true};}
window.manifest.anchors={frontAxle:axle(true),rearAxle:axle(false),engine:region([-1.95,0.4,-0.48],[-1.1,0.9,0.48]),battery:region([-0.6,0.24,-0.55],[0.95,0.48,0.55])};
const projected=points.map(p=>project(p.toArray()));
window.manifest.imageBounds=projected.reduce((b,p)=>({left:Math.min(b.left,p[0]),right:Math.max(b.right,p[0]),top:Math.min(b.top,p[1]),bottom:Math.max(b.bottom,p[1])}),{left:1,right:0,top:1,bottom:0});
window.ready=true;
}catch(e){window.failure=e.stack;}})();
</script></body></html>
