<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; width: 160px; height: 160px; }
    canvas { display: block; width: 160px; height: 160px; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const SIZE = 160;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(1);
// Match the rest of the catalog thumbs (vossen/bmw/haval_gt): transparent
// bg, not opaque black — opaque black reads as a different tile behind the rim.
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.001, 1e6);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 3.6);
key.position.set(2.5, 3.5, 5);
scene.add(key);
scene.add(new THREE.DirectionalLight(0xffffff, 1.5).translateX(-4));
scene.add(new THREE.DirectionalLight(0xffffff, 1.2).translateY(-2));

const draco = new DRACOLoader();
draco.setDecoderPath('/vendor/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

window.__thumbReady = false;
window.__thumbDataUrl = null;
window.__thumbError = null;
window.__thumbFile = null;
const file = new URLSearchParams(location.search).get('file') || '/assets/wheels/HavalHEV-wheel.glb';
loader.load(file, (gltf) => {
  const root = gltf.scene;
  // Near-black metal is invisible on dark catalog thumbs — lift albedo for the
  // preview only (runtime viewer keeps the authored colour).
  root.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (!m) continue;
      // Catalog thumbs need readable silhouette on pure black — lift dark metals.
      if (m.color && m.color.getHex() < 0x404040) m.color.setHex(0x5a5a5a);
      if ('metalness' in m) m.metalness = Math.min(Number(m.metalness) || 0.6, 0.55);
      if ('roughness' in m) m.roughness = Math.max(Number(m.roughness) || 0.35, 0.32);
      if (m.emissive) m.emissive.setHex(0x000000);
      if ('emissiveIntensity' in m) m.emissiveIntensity = 0;
      m.side = THREE.DoubleSide;
      m.needsUpdate = true;
    }
  });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  root.position.sub(center);

  // Face-on along Z (outer face after extract orient). Slight Y lift for catalog look.
  const faceRadius = Math.max(size.x, size.y) * 0.5;
  const dist = (faceRadius / Math.tan((camera.fov * Math.PI / 180) / 2)) * 1.28;
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();

  const scorePixels = () => {
    const url = renderer.domElement.toDataURL('image/png');
    // Cheap brightness proxy: longer PNG usually means more non-flat content.
    return { url, score: url.length };
  };

  const tryCam = (sign) => {
    camera.position.set(dist * 0.08, dist * 0.12, dist * sign);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    return scorePixels();
  };

  // Pick the viewing hemisphere that shows more wheel (handles before/after face flips).
  const a = tryCam(1);
  const b = tryCam(-1);
  const best = b.score > a.score ? b : a;

  requestAnimationFrame(() => {
    // Re-render the winner after a frame for SwiftShader stability.
    if (best === b) tryCam(-1);
    else tryCam(1);
    window.__debug = {
      size: size.toArray(),
      dist,
      file,
      meshCount: 0,
      scores: { plusZ: a.score, minusZ: b.score },
    };
    root.traverse((o) => { if (o.isMesh) window.__debug.meshCount++; });
    window.__thumbFile = file;
    window.__thumbDataUrl = renderer.domElement.toDataURL('image/png');
    window.__thumbReady = true;
  });
}, undefined, (e) => { window.__thumbError = String(e?.message || e); });
</script>
</body>
</html>
