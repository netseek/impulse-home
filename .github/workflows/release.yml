name: Release

# Push a tag to cut a release:   git tag v1.2.0 && git push origin v1.2.0
# A tag containing a hyphen (v1.2.0-preview.1) is published as a pre-release.
# See docs/release/RELEASING.md for the one-time setup (signing key and secrets).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only release commits from the right branch
        # A stable tag (v1.2.0) must be on main. A preview tag (v1.2.0-preview.1)
        # may come from the preview branch or from main.
        run: |
          git fetch origin main
          git fetch origin preview || true
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>/dev/null \
              || git merge-base --is-ancestor "$GITHUB_SHA" origin/preview 2>/dev/null \
              || { echo "::error::a preview tag must be on main or preview"; exit 1; }
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::a stable tag must be on main"; exit 1; }
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        # prepare-android-www.mjs (run by Gradle) bundles with esbuild.
        run: npm ci
      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: v
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BASE="${VER%%-*}"
          IFS=. read -r MA MI PA <<< "$BASE"
          # Strict on purpose: later steps interpolate this value into shell commands.
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag must look like v1.2.3 or v1.2.3-preview.1"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* ]]; then echo "channel=preview" >> "$GITHUB_OUTPUT"; else echo "channel=stable" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch the pinned asset bundle
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: node scripts/fetch-assets.mjs

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain             -PappVersionName="${{ steps.v.outputs.version }}"             -PappVersionCode="${{ steps.v.outputs.code }}"

      - name: Sign with the release key and the rotation lineage
        # The first builds of this app were signed with a debug key. release/signing-lineage.bin
        # proves to Android that the release key is that key's successor, so a device that still
        # has the old build can update in place and keep its data. The v1 (JAR) signature cannot
        # carry a rotation and would demand the old private key, so it is turned off explicitly
        # (--min-sdk-version alone does not: apksigner still insists on the oldest signer);
        # every head unit this app targets is Android 9 or newer.
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "${BT}apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --lineage release/signing-lineage.bin --min-sdk-version 24 --v1-signing-enabled false \
            --out impulse-home.apk aligned.apk

      - name: Verify the signature
        id: sig
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose impulse-home.apk
          SIGNER=$("$APKSIGNER" verify --print-certs impulse-home.apk \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "signer=$SIGNER" >> "$GITHUB_OUTPUT"
          echo "Signed by $SIGNER"
          # The rotation must really be in the APK: two signers in its lineage, the older one first.
          LINEAGE=$("$APKSIGNER" lineage --in impulse-home.apk --print-certs | grep -c 'certificate SHA-256 digest' || true)
          echo "signers in the lineage: $LINEAGE"
          if [ "$LINEAGE" -lt 2 ]; then echo "::error::the APK carries no rotation lineage"; exit 1; fi
          if [ -n "${{ vars.RELEASE_SIGNER_SHA256 }}" ] && [ "$SIGNER" != "${{ vars.RELEASE_SIGNER_SHA256 }}" ]; then
            echo "::error::signed with an unexpected key"; exit 1
          fi

      - name: Release notes and manifest
        run: |
          # Only version tags count as the previous release: the channel-* tags are moving pointers.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "First public release." > NOTES.md
          else
            git log --no-merges --format='- %s' "$PREV..$GITHUB_REF_NAME" > NOTES.md
          fi
          node scripts/make-latest-json.mjs \
            --apk impulse-home.apk \
            --version "${{ steps.v.outputs.version }}" \
            --code "${{ steps.v.outputs.code }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer "${{ steps.sig.outputs.signer }}" \
            --channel "${{ steps.v.outputs.channel }}" \
            --notes-file NOTES.md \
            --out latest.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [ "${{ steps.v.outputs.channel }}" = "preview" ]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" impulse-home.apk latest.json \
            --title "Impulse Launcher ${{ steps.v.outputs.version }}" \
            --notes-file NOTES.md $FLAGS

      - name: Point the channel at this release
        # Impulse follows a channel through a URL that never changes:
        #   .../releases/download/channel-stable/latest.json
        #   .../releases/download/channel-preview/latest.json
        # Each channel is a release that holds only latest.json, overwritten here.
        # It is a pre-release so it never takes the "Latest" badge from a real one.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CH="channel-${{ steps.v.outputs.channel }}"
          if ! gh release view "$CH" >/dev/null 2>&1; then
            gh release create "$CH" --prerelease --target "$GITHUB_SHA" \
              --title "Channel: ${{ steps.v.outputs.channel }}" \
              --notes "Moving pointer. It holds only latest.json for the ${{ steps.v.outputs.channel }} channel; installable builds are the versioned releases."
          fi
          gh release upload "$CH" latest.json --clobber
