name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the asset bundle (skipped where the token is unavailable)
        # Fork pull requests cannot read secrets, so they run without the bundle
        # and the tests that need it are skipped, not failed.
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then node scripts/fetch-assets.mjs || echo "::warning::asset bundle not available"; fi
      - name: Node contract tests
        run: node scripts/run-tests.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        # prepare-android-www.mjs (run by Gradle) bundles with esbuild.
        run: npm ci
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug build and JVM tests
        # Built WITHOUT the asset bundle: this proves the code compiles and the
        # trip-engine tests pass. The 3D models are not needed for either, and PRs
        # from forks cannot read the private bundle anyway.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --console=plain
