name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node contract tests
        run: node scripts/run-tests.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug build and JVM tests
        # Built WITHOUT the asset bundle: this proves the code compiles and the
        # trip-engine tests pass. The 3D models are not needed for either, and PRs
        # from forks cannot read the private bundle anyway.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --console=plain
